; DIALECTIC 1.1.0 Configuration
; Place this file in: Data\NVSE\Plugins\dialectic.ini
; This file contains shipped defaults and may be replaced by updates.
; Put user overrides in dialectic_custom.ini or change settings through MCM.

[Server]
; DIALECTIC Server connection settings
Host=127.0.0.1
Port=8085
Path=DialecticServer/main.php
; Optional local fast path. Leave empty unless this points at the active webserver soundcache.
LocalSoundcachePath=
[Hotkeys]
; Hotkeys are disabled by default. Set them in MCM to enable.
TalkToNPC=0
StopTalking=0
ToggleVoice=0
ManualActivate=0
OpenMenu=0
QuickCommand=0
DialecticControl=0
OpenMicMute=0
PipVision=0

[Audio]
; Player-heard AI voice playback settings.
VoiceVolume=75
; Narrator and player TTS volume relative to VoiceVolume. 100 keeps the current level.
HeadVoiceVolume=100
PreClipMs=100
PostClipMs=100
AnimationResolution=500
AnimationIntensity=1.0
; Set 0 for flat 2D playback.
Enable3DPlayback=1
; 1.0 is natural stereo separation; higher values make actor position more noticeable.
PanStrength=1.0
; Flip left/right heading if FNV orientation is reversed on your setup.
InvertHeading=0
; AI voice distance falloff curve. Higher values drop volume faster with distance.
DistanceScale=2.0
; Player-heard playback dropoff tuning. 70 is the default reference value.
PlaybackDropoffInteriorPercent=70
PlaybackDropoffExteriorPercent=70

[Behavior]
; Allow AI dialogue during combat?
EnableCombatDialogue=0
; Queue/audio cancellation when the player enters combat.
CancelDialogueOnCombat=1
; Timeout for AI responses (seconds)
AIResponseTimeout=30
; Pause AI dialogue while normal menus or the Pip-Boy are open.
PauseDialogueOnMenu=1
; Show passive Fallout-style subtitles while AI audio plays.
ShowAISubtitles=1
; Scene safety. Avoid actors currently controlled by interrupt/dialogue scene packages.
SceneSafety=1

[DialogueCapture]
; Passive capture of vanilla/radiant FNV dialogue into the eventlog. This never starts AI generation.
Enabled=1
CaptureRadiant=1
CaptureDialogueMenu=1
CapturePlayerMenuChoices=1
MinRepeatWindowMs=4000
RequireKnownSpeaker=0

[VoiceRecording]
; Automatic WASAPI microphone capture settings for player speech-to-text.
SilenceThreshold=500
MaxRecordingSeconds=60
; Keep the latest WAV submitted to STT for diagnostics.
SaveLastRecording=0
; Friendly-name migration hint and read-only display value. DIALECTIC detects the live microphone automatically.
CurrentDevice=Windows default
; Stable Core Audio endpoint ID is written to dialectic_custom.ini after successful discovery.
DetectedEndpointId=

[OpenMic]
; Open mic voice activity detection. Disabled by default.
Enabled=0
; RMS threshold for starting capture. Higher values require louder speech.
Sensitivity=1000
; Seconds of silence before open mic recording is submitted.
EndDelaySeconds=1.0
Muted=0

[Distance]
; How close player must be to activate NPC dialogue
ActivatingNpcInterior=1200
ActivatingNpcExterior=2400

[AutoActivate]
; Master toggle for auto-activation of nearby NPCs
Enabled=1
; Include hostile NPCs as AI agents?
AutoAddHostile=0
; Allow all race/form categories? 0 limits auto activation to humans, non-feral ghouls, super mutants, and non-animal robots.
AutoAddCreatures=0

[RpgEvents]
; Combat bark controls. Combat dialogue itself is controlled by [Behavior] EnableCombatDialogue.
CombatBarksEnabled=1
CombatBarkPeriodSeconds=30

[SpatialAudio]
; Spatial awareness for NPC hearing, auto-activation, and listener selection. Player-heard playback is configured in [Audio].
Enabled=1
; Spatial awareness guard rails. AutoHearingDistance defaults to 11.2m at 70 FNV units/meter.
MaxAirDistance=5600
ImmediateDistance=210
AutoHearingDistance=784
; Awareness falloff curve. This does not control player-heard voice panning.
DistanceScaler=1.0
InteriorHearingDistance=1050
ExteriorHearingDistance=1750
MinDistanceFactor=0.1
InteriorBaseModifier=1.0
ExteriorBaseModifier=0.7
OpenDoorPenaltyBase=0.85
AroundCornerPenalty=0.60
DoorTriangulationPercentTolerance=0.20
DoorTriangulationAbsoluteTolerance=80
MinimumAudibleVolume=0.15
; Path policy. These apply only when a native/script path provider reports real path data.
PathRatioReject=4.0
PathRatioDistanceReject=2.5
PathRatioDistanceRejectMinAir=500
PathComplexityStartRatio=1.2
PathComplexityScale=0.6
PathComplexityMin=0.3
NavmeshSnapDistance=450
; Keep current distance/LOS fallback when no FNV path provider is available.
AllowPathUnavailableFallback=1

[WorldContext]
; FNV world prompt context: location, weather, and in-game date/time.
Enabled=1
UpdateSeconds=60
SendOnChange=1
SendBeforePlayerInput=1
IncludeWeather=1
IncludeCell=1
IncludeWorldspace=1

[NearbyActors]
; Structured nearby actor snapshots for <nearby_actors> prompt context.
Enabled=1
UpdateSeconds=5
SendOnChange=1
SendBeforePlayerInput=1
MaxActors=12
MaxDistance=2400

[ActivityStatus]
; Live actor condition/activity snapshots for <activity> and <condition> prompt context.
Enabled=1
UpdateSeconds=5
SendOnChange=1
SendBeforePlayerInput=1
MaxActors=16
MaxDistance=2400

[NearbyItems]
; Structured nearby item snapshots for <nearby_items> prompt context.
Enabled=1
UpdateSeconds=5
SendOnChange=1
SendBeforePlayerInput=1
MaxItems=32
MaxDistance=1000
IncludeStealing=1
IncludeLookingAt=1
IncludeHeldItem=1
HeldItemPriority=1

[PointsOfInterest]
; Structured door/location snapshots for <points_of_interest> prompt context.
Enabled=1
UpdateSeconds=60
SendOnChange=1
SendBeforePlayerInput=1
MaxPois=16
MaxDistance=1600
IncludeDoors=1
IncludeLocked=1
IncludeLookingAt=1

[Hotkeys].
; Always enabled; TimerMinutes controls how often background refreshes run.
TimerMinutes=30
IncludeNarrator=1

[BoredEvents]
; Idle/bored NPC comments. Always enabled; server-side BORED_EVENT controls probability.
TimerSeconds=60
AvoidInMenu=1
AvoidInDialogue=1
AvoidInCombat=1
AvoidWhenSneaking=1
AvoidWhenVoiceInputActive=1
RecentSpeechCooldownSeconds=20

[Rechat]
; Plugin-side rechat launch policy. Server controls rechat probability and mode.
Enabled=1
MaxDepth=10
SmartLaunch=1
RetryOnEmpty=1
AvoidWhenSneaking=1
AvoidInMenu=1
EndConversationCooldown=60

[ExcludedRaces]
; Races to exclude from AI agents (by name, one per line)
; Example: Race1=Deathclaw

[ExcludedNPCs]
; Specific NPCs to never make AI agents (by name)
; Example: NPC1=Yes Man

[ExcludedFormIDs]
; Exclude by form ID (hex, no 0x prefix)
; Example: FormID1=00123456

[Tools]
InitializeDialectic=0
SendWorldData=0
SendVoiceSamples=0
UpdateTargetProfile=0
UpdateNearbyProfiles=0
UpdateNarratorProfile=0

[Multiplayer]
; Legacy self-hosted relay: 0=Off, 1=Host, 2=Listen.
; Public sessions are started explicitly in Tools and are never saved.
; Maintainer sets the public HTTPS endpoint before distributing a hosted-relay build.
PublicRelayURL=https://dialectic-relay-production.up.railway.app/index.php
Mode=0
